[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flipscout"
version = "0.1.0"
description = "Private-party used-car flip scout (personal use)"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "jinja2>=3.1",
  "beautifulsoup4>=4.12",
  "playwright>=1.45",
  "anthropic>=1.0",
  "keyring>=24",
  "pillow>=10",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flipscout = "flipscout.cli:main"

[tool.setuptools.packages.find]
include = ["flipscout*"]

[tool.setuptools.package-data]
flipscout = ["report/*.j2", "schedule/*.j2", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
