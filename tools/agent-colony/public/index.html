<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Colony</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><polygon points='16,2 29,9 29,23 16,30 3,23 3,9' fill='%233d7bf2'/><circle cx='12' cy='15' r='2.5' fill='%237dffb2'/><circle cx='20' cy='15' r='2.5' fill='%237dffb2'/></svg>">
  <link rel="stylesheet" href="/styles.css">
  <script type="importmap">
    { "imports": {
      "three": "/vendor/three/build/three.module.js",
      "three/addons/": "/vendor/three/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div id="labels"></div>

  <nav id="toolbar" aria-label="View">
    <button data-act="home" title="Whole colony (H)"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
    <button data-act="follow" title="Follow selected bot (F)" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    <button data-act="labels" title="Show every zone name (L)"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></svg></button>
    <button data-act="spin" title="Slowly orbit"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></svg></button>
    <button data-act="settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
  </nav>

  <div id="settings" class="pop hidden">
    <h3>Settings</h3>
    <label>Open threads in
      <select id="set-open">
        <option value="terminal">Terminal (claude --resume)</option>
        <option value="app">Claude desktop app</option>
        <option value="copy">Just copy the command</option>
      </select>
    </label>
    <label>New agents may
      <select id="set-perm"></select>
    </label>
    <label class="row"><input type="checkbox" id="set-shadows" checked> Shadows</label>
    <button id="set-unarchive" class="ghost">Bring back archived threads</button>
    <p class="muted" id="set-info"></p>
  </div>

  <aside id="panel">
    <header>
      <div class="brand"><span class="logo"></span> Agent Colony</div>
      <div id="counts" class="counts"></div>
    </header>
    <div id="panel-body"></div>
  </aside>

  <div id="card" class="card hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <div id="loading">Landing…</div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
